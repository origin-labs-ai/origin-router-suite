name: Deploy onboarding site

# Static GitHub Pages helper for first-run setup: pick a local data folder,
# add BYOK keys, and hand the gateway the generated config. No server, no keys
# in the build, no npm dependencies — the site is plain HTML/CSS/JS in site/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate provider catalog from registry
        run: node scripts/generate-pages-catalog.mjs

      - name: Verify generated site
        run: |
          node -e "const c=require('./site/providers.json'); if(!c.total || !c.providers.length) { console.error('empty catalog'); process.exit(1) } console.log('catalog:', c.total, 'providers')"
          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: release

# Publishes the same three artifacts the build machine produces:
#   OriginRouter-Setup-<v>.exe            gateway + dashboard installer (Inno)
#   OriginRouter-Desktop-Setup-<v>.exe    desktop window installer (Inno, bundles the gateway)
#   origin-router-<v>.tgz                  CLI launcher package (npm identity: @origin-labs-ai/origin-router)
# plus a .sha256 next to every binary, which is what the updater verifies before it
# installs anything.
#
# Installs use `npm install`, not `npm ci`: the only lockfiles that ever came from
# upstream belong to upstream's own dependency graph and are ignored here (see
# .gitignore), and `npm ci` fails outright without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: build (windows installers + cli tarball)
    runs-on: windows-latest
    # A stuck job must die instead of burning a runner for hours: the packaging
    # step once sat there for 45 minutes on a full disk, retrying every file.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # A tag push names the version; a manual dispatch builds whatever
          # package.json says, because "main" is not a version and TrimStart('v')
          # would happily turn it into one.
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -like 'v*') { $ref.TrimStart('v') } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          if (-not ($version -match '^\d+\.\d+\.\d+$')) { throw "unusable version: '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $version"

      - name: Install app deps
        run: npm install --no-audit --no-fund

      - name: Build CLI package (bundles the gateway into cli/app)
        # The CLI build runs the Next.js standalone build itself (into
        # .next-cli-build) and npm fires the root postbuild hook with it. A
        # separate root `npm run build` on top of that only produced a second
        # copy of the same app, and that copy was what pushed the runner over
        # its disk limit - it shipped in nothing.
        run: |
          npm install --no-audit --no-fund --prefix cli
          npm run build --prefix cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Reclaim build disk before packaging
        shell: pwsh
        run: |
          # The work tree lives on the runner's D: drive, which starts with
          # ~14 GB free. The Next.js build tree (~2 GB) and the root
          # node_modules (~1.2 GB) are build-time only: everything that ships
          # is inside cli/app.
          #
          # Deleting them is not a one-liner. npm nests packages past the
          # 260-character path limit, so `rd /s /q` fails on the deep entries
          # and PowerShell's own delete fails with a non-terminating error -
          # and the step still looked green while the disk stayed full.
          # robocopy can empty a tree it can walk, so an empty folder is
          # mirrored over the target first and the leftover shell is removed
          # after that.
          foreach ($target in @(".next", ".next-cli-build", "node_modules")) {
            if (-not (Test-Path $target)) { continue }
            Write-Host "removing $target"
            $full = (Resolve-Path $target).Path
            $empty = Join-Path $env:TEMP "originrouter-empty"
            New-Item -ItemType Directory -Force -Path $empty | Out-Null
            cmd /c "robocopy `"$empty`" `"$full`" /MIR /R:0 /W:0 /NFL /NDL /NJH /NJS /NP" | Out-Null
            cmd /c "rd /s /q `"$full`"" | Out-Null
            if (Test-Path $target) {
              Write-Host "  still there - trying the long-path form"
              cmd /c "rd /s /q `"\\?\$full`"" | Out-Null
            }
            if (Test-Path $target) { throw "could not remove $target - the disk will fill up again" }
          }
          $free = (Get-PSDrive -Name D).Free
          Write-Host ("free on D: after reclaim: {0:N2} GB" -f ($free / 1GB))
          if ($free -lt 4GB) { throw "only $($free/1GB) GB free on the work drive - not enough to package" }

      - name: Check room for the portable folder
        shell: pwsh
        run: |
          # The copy below writes ~300 MB in ~12k small files. On a drive that
          # is already close to full, robocopy does not fail fast: it retries
          # every file with a one second wait, which turned a packaging step
          # into a 76 minute stall before it died with ENOSPC. Refuse to
          # start instead.
          $free = (Get-PSDrive -Name D).Free
          Write-Host ("free on D: before packaging: {0:N2} GB" -f ($free / 1GB))
          if ($free -lt 2GB) { throw "only $($free/1GB) GB free - refusing to start the copy" }

      - name: Package the portable win folder
        run: node scripts/package-cli.mjs --platform=win

      - name: Portable win zip (beta)
        # The portable zip is the no-installer build: unzip it anywhere and run
        # originrouter.cmd. It asks once whether to live in the system tray,
        # because there is no installer task to ask.
        shell: pwsh
        run: |
          $out = "dist\portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = Join-Path $out "OriginRouter-win-portable.zip"
          $sevenZip = Join-Path ${env:ProgramFiles} "7-Zip\7z.exe"
          if (Test-Path $sevenZip) {
            & $sevenZip a -tzip -mx=7 $zip "dist\win\*" | Out-Null
          } else {
            Compress-Archive -Path "dist\win\*" -DestinationPath $zip
          }
          if (-not (Test-Path $zip)) { throw "the portable zip was not created" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OriginRouter-win-portable.zip" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "portable zip: $([math]::Round((Get-Item $zip).Length/1MB,1)) MB"

      - name: Gateway installer (Inno Setup 6)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\origin-router.iss" "/DAppVersion=$version"

      - name: Desktop installer (electron-builder unpacked dir, then Inno Setup 6)
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --prefix desktop
          npm run dist:win --prefix desktop

      - name: CLI launcher tarball
        # Must be packed from inside cli/: `npm pack --prefix cli` reads the root
        # package.json instead and produces a tarball of the entire repository.
        working-directory: cli
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          npm pack --pack-destination ..\dist\installer --ignore-scripts
          # A scoped package packs as <scope>-<name>-<version>.tgz. The release
          # asset is named after the product, not after the npm scope.
          $packed = Get-ChildItem ..\dist\installer\*.tgz | Select-Object -First 1
          if (-not $packed) { throw "npm pack produced no tarball" }
          Rename-Item -Path $packed.FullName -NewName "origin-router-$version.tgz"

      - name: Checksums
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $names = @(
            "OriginRouter-Setup-$version.exe",
            "OriginRouter-Desktop-Setup-$version.exe",
            "origin-router-$version.tgz"
          )
          $lines = @()
          foreach ($name in $names) {
            $file = Join-Path "dist\installer" $name
            if (-not (Test-Path $file)) { throw "expected artifact missing: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "$file.sha256" -Encoding ascii
            $lines += "$((Get-FileHash $file -Algorithm SHA256).Hash.ToUpper())  $name"
          }
          $lines | Set-Content (Join-Path "dist\installer" "checksums.sha256") -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: OriginRouter-windows
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.tgz
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: error

  portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app deps
        run: npm install --no-audit --no-fund
      - name: Install CLI deps
        run: npm install --no-audit --no-fund
        working-directory: cli
      - name: Build CLI bundle (Next standalone + assets)
        run: npm run build
        working-directory: cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package portable folder
        run: node scripts/package-cli.mjs --platform=${{ matrix.platform }}
      - name: Zip portable folder
        # The portable zip is the beta channel: unzip it anywhere and run the
        # launcher. It asks once whether to live in the system tray, because
        # there is no installer task to ask.
        run: |
          mkdir -p dist/portable
          cd dist/${{ matrix.platform }} && zip -r ../portable/OriginRouter-${{ matrix.platform }}-portable.zip .
      - name: Checksum the portable zip
        run: |
          cd dist/portable
          sha256sum OriginRouter-${{ matrix.platform }}-portable.zip > OriginRouter-${{ matrix.platform }}-portable.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OriginRouter-${{ matrix.platform }}
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          if-no-files-found: warn

  release:
    needs: [windows, portable]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release notes
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # Curated notes live next to the release. Without one, the release
          # still ships - the auto-generated changelog is used instead.
          if [ -f "docs/releases/${version}.md" ]; then
            cp "docs/releases/${version}.md" release-notes.md
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
            echo "Using curated notes from docs/releases/${version}.md"
          else
            echo "No curated notes for ${version}; falling back to the generated changelog"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true

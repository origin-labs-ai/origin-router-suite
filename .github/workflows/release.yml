name: release

# Publishes the same three artifacts the build machine produces:
#   OriginRouter-Setup-<v>.exe            gateway + dashboard installer (Inno)
#   OriginRouter-Desktop-Setup-<v>.exe    desktop window installer (Inno, bundles the gateway)
#   originrouter-<v>.tgz                  CLI launcher package (npm identity: originrouter)
# plus a .sha256 next to every binary, which is what the updater verifies before it
# installs anything.
#
# Installs use `npm install`, not `npm ci`: the only lockfiles that ever came from
# upstream belong to upstream's own dependency graph and are ignored here (see
# .gitignore), and `npm ci` fails outright without one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: build (windows installers + cli tarball)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # A tag push names the version; a manual dispatch builds whatever
          # package.json says, because "main" is not a version and TrimStart('v')
          # would happily turn it into one.
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -like 'v*') { $ref.TrimStart('v') } else { (Get-Content package.json -Raw | ConvertFrom-Json).version }
          if (-not ($version -match '^\d+\.\d+\.\d+$')) { throw "unusable version: '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $version"

      - name: Install app deps
        run: npm install --no-audit --no-fund

      - name: Build gateway (Next standalone) and copy standalone assets
        run: |
          npm run build
          npm run postbuild
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build CLI package (bundles the gateway into cli/app)
        run: |
          npm install --no-audit --no-fund --prefix cli
          npm run build --prefix cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package the portable win folder
        run: node scripts/package-cli.mjs --platform=win

      - name: Gateway installer (Inno Setup 6)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\origin-router.iss" "/DAppVersion=$version"

      - name: Desktop installer (electron-builder unpacked dir, then Inno Setup 6)
        shell: pwsh
        run: |
          npm install --no-audit --no-fund --prefix desktop
          npm run dist:win --prefix desktop

      - name: CLI launcher tarball
        # Must be packed from inside cli/: `npm pack --prefix cli` reads the root
        # package.json instead and produces a tarball of the entire repository.
        working-directory: cli
        run: npm pack --pack-destination ..\dist\installer --ignore-scripts

      - name: Checksums
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $names = @(
            "OriginRouter-Setup-$version.exe",
            "OriginRouter-Desktop-Setup-$version.exe",
            "originrouter-$version.tgz"
          )
          $lines = @()
          foreach ($name in $names) {
            $file = Join-Path "dist\installer" $name
            if (-not (Test-Path $file)) { throw "expected artifact missing: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "$file.sha256" -Encoding ascii
            $lines += "$((Get-FileHash $file -Algorithm SHA256).Hash.ToUpper())  $name"
          }
          $lines | Set-Content (Join-Path "dist\installer" "checksums.sha256") -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: OriginRouter-windows
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.tgz
          if-no-files-found: error

  portable:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app deps
        run: npm install --no-audit --no-fund
      - name: Install CLI deps
        run: npm install --no-audit --no-fund
        working-directory: cli
      - name: Build CLI bundle (Next standalone + assets)
        run: npm run build
        working-directory: cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package portable folder
        run: node scripts/package-cli.mjs --platform=${{ matrix.platform }}
      - name: Zip portable folder
        run: cd dist/${{ matrix.platform }} && zip -r ../OriginRouter-${{ matrix.platform }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: OriginRouter-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: warn

  release:
    needs: [windows, portable]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

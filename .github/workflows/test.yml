name: test

# The test gate: run the full vitest suite on every push to main and every PR.
# This workflow did not exist before v0.6.000 — CI previously built and released
# without ever running the tests. Every job runs `npm test` (wired at the root
# package.json to `npm --prefix tests run test`), which is the same command a
# contributor runs locally.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tests (ubuntu, node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `cache: npm` here, deliberately. That option keys the npm cache on
      # package-lock.json and FAILS the whole job when the file is missing - and
      # this repo ships no lockfile on purpose (see .gitignore: the only ones
      # that ever existed came from the upstream snapshot, pinned to its own
      # dependency set, so committing them would pin the wrong graph).
      # Cache the npm tarball store explicitly instead, keyed on the manifests
      # that do exist. A miss only costs a re-download, never a failed job.
      - name: Cache the npm tarball store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'tests/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Root deps first (the suite imports open-sse/ and src/ from the repo root),
      # then the tests/ package. `npm install` not `npm ci`: there is no committed
      # lockfile (see .gitignore). `--no-package-lock` keeps the run honest about
      # that too - without it npm WRITES a package-lock.json here, and that fresh
      # root lockfile is what made the nested `--prefix tests` install below
      # crash inside arborist ("Cannot read properties of null (reading
      # 'edgesOut')"), which is how this job died after setup-node was fixed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      # `working-directory` instead of `npm --prefix tests`: the cwd form is the
      # documented way (CLAUDE.md: `cd tests && npm install`) and does not go
      # through the prefix path that npm handles poorly for a nested package.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Run test suite
        run: npm test

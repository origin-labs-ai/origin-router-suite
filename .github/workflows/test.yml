name: test

# The test gate: run the full vitest suite on every push to main and every PR.
# This workflow did not exist before v0.6.000 — CI previously built and released
# without ever running the tests. Every job runs `npm test` (wired at the root
# package.json to `npm --prefix tests run test`), which is the same command a
# contributor runs locally.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: tests (ubuntu, node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `cache: npm` here, deliberately. That option keys the npm cache on
      # package-lock.json and FAILS the whole job when the file is missing - and
      # this repo ships no lockfile on purpose (see .gitignore: the only ones
      # that ever existed came from the upstream snapshot, pinned to its own
      # dependency set, so committing them would pin the wrong graph).
      # Cache the npm tarball store explicitly instead, keyed on the manifests
      # that do exist. A miss only costs a re-download, never a failed job.
      - name: Cache the npm tarball store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'tests/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Codex speech-to-text shells out to ffmpeg (open-sse/handlers/
      # codexSttAudio.js: spawn("ffmpeg", ...)), and four tests exercise a real
      # conversion instead of mocking it. The runner image does not ship ffmpeg,
      # so without this they fail with "ffmpeg is required for transcription"
      # (503) - a missing system binary, not a code regression.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Root deps first (the suite imports open-sse/ and src/ from the repo root),
      # then the tests/ package. `npm install` not `npm ci`: there is no committed
      # lockfile (see .gitignore), and `--no-package-lock` keeps the installed
      # tree lockfile-free too, so nothing here pins a dependency graph the repo
      # has explicitly decided not to pin.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      # `working-directory` instead of `npm --prefix tests`: the cwd form is the
      # documented way (CLAUDE.md: `cd tests && npm install`).
      #
      # `--legacy-peer-deps` is load-bearing here, not a preference. npm 10 (what
      # node 22 ships) crashes while resolving vitest 4's peer graph:
      #
      #   TypeError: Cannot read properties of null (reading 'edgesOut')
      #     at @npmcli/arborist lib/arborist/build-ideal-tree.js #loadPeerSet
      #
      # Newer npm (11/12) walks that graph fine, which is why a local install on
      # node 24 never showed it. The flag skips the peer-set walk - the exact
      # code path that throws - and this package is test-only (vitest + lowdb,
      # unit tests only, no browser mode), so there is no peer it needs to
      # satisfy. Verified on npm 10.9.10: install succeeds and `npm test` passes
      # 4751/4751.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund --no-package-lock --legacy-peer-deps

      - name: Run test suite
        run: npm test

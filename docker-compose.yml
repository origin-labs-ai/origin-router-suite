services:
  # OriginRouter gateway + dashboard, built from this repository.
  # The `docker-publish` workflow also pushes the same image to
  # ghcr.io/<owner>/<repo>:<version> for tag pushes.
  origin-router:
    image: origin-router:local
    build: .
    container_name: origin-router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - origin-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  # Optional token-saver companion; the gateway runs fine without it and falls
  # back to its own RTK compressor when this is unreachable.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  origin-router-data:
    name: origin-router-data
